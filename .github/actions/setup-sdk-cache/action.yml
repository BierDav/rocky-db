name: Cache SDK tooling
description: Reuse build cache and toolchains for SDK-less Rust native builds.
inputs:
  scope:
	    description: Isolate cache by platform scope.
    default: jvm

runs:
  using: composite
  steps:
	    - uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
          ~/.konan
	        key: sdk-tooling-v1-${{ inputs.scope }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('source/Cargo.lock', 'source/rust-toolchain.toml') }}-${{ github.sha }}
        restore-keys: |
	          sdk-tooling-v1-${{ inputs.scope }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('source/Cargo.lock', 'source/rust-toolchain.toml') }}-
          sdk-tooling-v1-${{ inputs.scope }}-${{ runner.os }}-${{ runner.arch }}-
