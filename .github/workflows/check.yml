name: Baseline checks

# A job that passed for the same source tree records a cache marker; later runs
# of that tree (rebased, redescribed or released commits) reuse it instead of
# running again. See docs/development.md#ci.

on:
  # Only the default branch and the release call run baselines; there are no
  # other long-lived branches or pull requests.
  push:
    branches: [main]
  # Releases call only `build` and `check`; auxiliary jobs run on pushes.
  # The build and checks are skipped for a tree that passed.
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false

permissions:
  contents: read

# A newer push supersedes a run, but a release's call must not cancel another
# release's checks, which share the caller's workflow name and ref.
concurrency:
  # Let runs from before cache seeding finish their checks.
  group: ${{ github.workflow }}-${{ github.ref }}-source-cache-v2
  cancel-in-progress: ${{ github.event_name == 'push' }}

env:
  CARGO_TERM_COLOR: always
  # CI always uses the repository's LLVM toolchain, including on host runners.
  ROCKY_CRANELIFT: '0'
  # Smaller test binaries and build cache; backtraces keep line numbers.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  # The SDK persists `identity.json` from its runtime thread; a fault-injection
  # test can race the temporary path a persist briefly holds. Retry once.
  NEXTEST_RETRIES: 1

jobs:
  lint:
    if: ${{ !inputs.release }}
    # Formatting and static lint checks need no build, so they fail fast; see docs/linting.md.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download the exact source revision
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_API_URL: ${{ github.api_url }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          api() {
            curl --fail --silent --show-error --location \
              --retry 3 --retry-all-errors --retry-delay 2 --connect-timeout 10 --max-time 120 \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "Accept: application/vnd.github+json" \
              --output "$2" \
              "${GH_API_URL}/repos/${GH_REPOSITORY}/$1"
          }
          api "tarball/${GH_REVISION}" "$RUNNER_TEMP/source.tar.gz"
          mkdir source
          tar -xzf "$RUNNER_TEMP/source.tar.gz" --strip-components=1 -C source
          api "commits/${GH_REVISION}?stat=false&files=false" "$RUNNER_TEMP/commit.json"
          tree=$(jq -er .commit.tree.sha "$RUNNER_TEMP/commit.json")
          echo "tree=$tree" >> "$GITHUB_OUTPUT"

      - name: Look for a passing run of this tree
        id: passed
        uses: actions/cache/restore@v4
        with:
          path: passed
          key: baseline-lint-${{ runner.os }}-${{ steps.source.outputs.tree }}
          lookup-only: true

      - name: Bootstrap Rustup and register its tool paths
        if: steps.passed.outputs.cache-hit != 'true'
        working-directory: source
        run: ./scripts/ci/install-rustup

      - uses: dtolnay/rust-toolchain@1.99.0
        if: steps.passed.outputs.cache-hit != 'true'
        with:
          components: rustfmt, clippy

      - uses: ./source/.github/actions/setup-sccache
        if: steps.passed.outputs.cache-hit != 'true'

      - name: Install the pinned lint tools
        if: steps.passed.outputs.cache-hit != 'true'
        working-directory: source
        run: ./scripts/tools

      - name: Run formatting and lint checks
        if: steps.passed.outputs.cache-hit != 'true'
        working-directory: source
        run: ./scripts/lint

      - name: Verify Cargo cache invalidation
        if: steps.passed.outputs.cache-hit != 'true'
        working-directory: source
        run: ./scripts/test-source-times

      - name: Record the passing tree
        if: steps.passed.outputs.cache-hit != 'true'
        run: touch passed

      - uses: actions/cache/save@v4
        if: steps.passed.outputs.cache-hit != 'true'
        with:
          path: passed
          key: baseline-lint-${{ runner.os }}-${{ steps.source.outputs.tree }}

  build:
    # Compiles once: clippy and the test binaries as nextest archives, plus the
    # custody peer. `check`, `e2e` and `shopping` run those artifacts instead of
    # building again, each downloading only what it runs. All consumers use
    # the x64 baseline, including shopping's Android prerequisite.
    runs-on: ubuntu-latest
    # A cold four-core build can exceed an hour, including artifact/cache saves.
    timeout-minutes: 90
    steps:
      - name: Download the exact source revision
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_API_URL: ${{ github.api_url }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          api() {
            curl --fail --silent --show-error --location \
              --retry 3 --retry-all-errors --retry-delay 2 --connect-timeout 10 --max-time 120 \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "Accept: application/vnd.github+json" \
              --output "$2" \
              "${GH_API_URL}/repos/${GH_REPOSITORY}/$1"
          }
          api "tarball/${GH_REVISION}" "$RUNNER_TEMP/source.tar.gz"
          mkdir source
          tar -xzf "$RUNNER_TEMP/source.tar.gz" --strip-components=1 -C source
          api "commits/${GH_REVISION}?stat=false&files=false" "$RUNNER_TEMP/commit.json"
          tree=$(jq -er .commit.tree.sha "$RUNNER_TEMP/commit.json")
          echo "tree=$tree" >> "$GITHUB_OUTPUT"

      # A tree whose checks passed needs no build.
      - name: Look for a passing check of this tree
        id: passed
        uses: actions/cache/restore@v4
        with:
          path: passed
          key: baseline-check-${{ runner.os }}-${{ steps.source.outputs.tree }}
          lookup-only: true

      - name: Install the system build dependencies
        if: steps.passed.outputs.cache-hit != 'true'
        working-directory: source
        run: ./scripts/ci/install-system-deps

      - name: Bootstrap Rustup and register its tool paths
        if: steps.passed.outputs.cache-hit != 'true'
        working-directory: source
        run: ./scripts/ci/install-rustup

      - uses: dtolnay/rust-toolchain@1.99.0
        if: steps.passed.outputs.cache-hit != 'true'
        with:
          components: rustfmt, clippy

      - uses: ./source/.github/actions/setup-sccache
        if: steps.passed.outputs.cache-hit != 'true'

      - name: Configure the test profile and source cache key
        if: steps.passed.outputs.cache-hit != 'true'
        working-directory: source
        env:
          SOURCE_TREE: ${{ steps.source.outputs.tree }}
        run: ./scripts/ci/test-profile "$SOURCE_TREE"

      - uses: Swatinem/rust-cache@v2
        if: steps.passed.outputs.cache-hit != 'true'
        with:
          workspaces: source -> target
          shared-key: check
          cache-workspace-crates: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Reuse timestamps of unchanged Cargo inputs
        if: steps.passed.outputs.cache-hit != 'true'
        working-directory: source
        run: ./scripts/ci/source-times

      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2
        if: steps.passed.outputs.cache-hit != 'true'
        with:
          tool: cargo-nextest

      - name: Build and archive the tests
        if: steps.passed.outputs.cache-hit != 'true'
        working-directory: source
        timeout-minutes: 60
        run: |
          set -euo pipefail
          ./scripts/check --build "$RUNNER_TEMP/build"
          cp "$(command -v cargo-nextest)" "$RUNNER_TEMP/build/cargo-nextest"

      # One artifact per consumer so a failure to finalize the large shared
      # archive cannot also lose the small ones, and every consumer downloads
      # only what it runs. A consumer rebuilds when its artifact is gone.
      - name: Upload the workspace test archive
        if: steps.passed.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: nextest-workspace
          path: ${{ runner.temp }}/build/workspace.tar.zst
          retention-days: 1
          # The archives are already compressed.
          compression-level: 0

      - name: Upload the SDK test archive
        if: steps.passed.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: nextest-sdk
          path: ${{ runner.temp }}/build/sdk-without-defaults.tar.zst
          retention-days: 1
          compression-level: 0

      - name: Upload the custody peer
        if: steps.passed.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: rocky-peer
          path: ${{ runner.temp }}/build/rocky-peer
          retention-days: 1
          compression-level: 0

      - name: Upload the test runner
        if: steps.passed.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: nextest-tools
          path: ${{ runner.temp }}/build/cargo-nextest
          retention-days: 1

  check:
    # A job after `build`: the source step, reuse-build, its own steps and
    # record-pass. Add a job the same way; see docs/development.md#adding-a-ci-job.
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Download the exact source revision
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_API_URL: ${{ github.api_url }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          api() {
            curl --fail --silent --show-error --location \
              --retry 3 --retry-all-errors --retry-delay 2 --connect-timeout 10 --max-time 120 \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "Accept: application/vnd.github+json" \
              --output "$2" \
              "${GH_API_URL}/repos/${GH_REPOSITORY}/$1"
          }
          api "tarball/${GH_REVISION}" "$RUNNER_TEMP/source.tar.gz"
          mkdir source
          tar -xzf "$RUNNER_TEMP/source.tar.gz" --strip-components=1 -C source
          api "commits/${GH_REVISION}?stat=false&files=false" "$RUNNER_TEMP/commit.json"
          tree=$(jq -er .commit.tree.sha "$RUNNER_TEMP/commit.json")
          echo "tree=$tree" >> "$GITHUB_OUTPUT"

      - id: reuse
        uses: ./source/.github/actions/reuse-build
        with:
          job: check
          tree: ${{ steps.source.outputs.tree }}
          workspace-archive: true
          sdk-archive: true
          dependencies: fallback

      - name: Run formatting and the unit and integration tiers
        if: steps.reuse.outputs.passed != 'true'
        working-directory: source
        run: |
          if [ -f "$RUNNER_TEMP/build/workspace.tar.zst" ] \
              && [ -f "$RUNNER_TEMP/build/sdk-without-defaults.tar.zst" ]; then
            ./scripts/check --from "$RUNNER_TEMP/build"
          else
            # The build job already ran clippy; only its archives are missing.
            # Rebuild the test binaries without repeating clippy.
            ./scripts/check --no-clippy
          fi

      - uses: ./source/.github/actions/record-pass
        if: steps.reuse.outputs.passed != 'true'
        with:
          job: check
          tree: ${{ steps.source.outputs.tree }}

  e2e:
    # The end-to-end tier, soak tests included; it runs only in CI. On pushes to
    # the default branch; releases do not wait for it.
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Download the exact source revision
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_API_URL: ${{ github.api_url }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          api() {
            curl --fail --silent --show-error --location \
              --retry 3 --retry-all-errors --retry-delay 2 --connect-timeout 10 --max-time 120 \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "Accept: application/vnd.github+json" \
              --output "$2" \
              "${GH_API_URL}/repos/${GH_REPOSITORY}/$1"
          }
          api "tarball/${GH_REVISION}" "$RUNNER_TEMP/source.tar.gz"
          mkdir source
          tar -xzf "$RUNNER_TEMP/source.tar.gz" --strip-components=1 -C source
          api "commits/${GH_REVISION}?stat=false&files=false" "$RUNNER_TEMP/commit.json"
          tree=$(jq -er .commit.tree.sha "$RUNNER_TEMP/commit.json")
          echo "tree=$tree" >> "$GITHUB_OUTPUT"

      - id: reuse
        uses: ./source/.github/actions/reuse-build
        with:
          job: e2e
          tree: ${{ steps.source.outputs.tree }}
          workspace-archive: true
          sdk-archive: true
          dependencies: fallback

      - name: Run the end-to-end tier
        if: steps.reuse.outputs.passed != 'true'
        working-directory: source
        run: |
          if [ -f "$RUNNER_TEMP/build/workspace.tar.zst" ] \
              && [ -f "$RUNNER_TEMP/build/sdk-without-defaults.tar.zst" ]; then
            ./scripts/check --e2e --from "$RUNNER_TEMP/build"
          else
            ./scripts/check --e2e
          fi

